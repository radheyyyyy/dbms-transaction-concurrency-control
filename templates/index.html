<!DOCTYPE html>
<html>
<head>
    <title>Bank System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h2, h3 {
            color: white;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th {
            background: #4facfe;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #4facfe;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #007bff;
        }
    </style>
</head>
<body>

<h2>💰 Bank Management System</h2>

<div class="container">

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Balance</th>
    </tr>

    {% for row in data %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>₹{{ row[2] }}</td>
    </tr>
    {% endfor %}
</table>

<h3>Transfer Money</h3>

<form action="/transfer" method="post">
    <input name="sender" placeholder="Sender (Raj)" required><br>
    <input name="receiver" placeholder="Receiver (Amit)" required><br>
    <input name="amount" type="number" placeholder="Amount" required><br><br>
    <button type="submit">Transfer</button>
</form>

</div>

</body>
</html>
